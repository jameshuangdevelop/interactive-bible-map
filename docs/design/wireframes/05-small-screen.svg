<svg xmlns="http://www.w3.org/2000/svg" width="900" height="930" viewBox="0 0 900 930" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Wireframe 05 — Small screen (basic in M3, polished in M7)</title>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3C4043" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3C4043" flood-opacity="0.15"/>
    </filter>
    <clipPath id="phoneA"><rect x="40" y="28" width="390" height="844" rx="36"/></clipPath>
    <clipPath id="phoneB"><rect x="470" y="28" width="390" height="844" rx="36"/></clipPath>
    <style>
      .note { font-size: 12px; fill: #C2185B; font-style: italic; }
      .label { font-size: 12px; fill: #202124; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; }
      .pin { fill: #C5221F; stroke: #ffffff; stroke-width: 2.5; }
      .h2 { font-size: 16px; font-weight: 500; fill: #202124; }
      .muted { font-size: 13px; fill: #5F6368; }
    </style>
  </defs>

  <!-- Phone A: map with bottom sheet peeking -->
  <g clip-path="url(#phoneA)">
    <rect x="40" y="28" width="390" height="844" fill="#F4F4F2"/>
    <ellipse cx="300" cy="330" rx="50" ry="120" fill="#D5E3EC"/>
    <circle cx="268" cy="214" r="11" class="pin"/><text class="label" x="176" y="218" font-weight="600">Capernaum</text>
    <circle cx="200" cy="330" r="8" class="pin"/><text class="label" x="138" y="334">Magdala</text>
    <circle cx="120" cy="470" r="8" class="pin"/><text class="label" x="134" y="474">Nazareth</text>
    <g filter="url(#shadow)"><rect x="56" y="72" width="358" height="48" rx="24" fill="#ffffff"/></g>
    <g stroke="#5F6368" stroke-width="2" stroke-linecap="round"><line x1="74" y1="89" x2="90" y2="89"/><line x1="74" y1="96" x2="90" y2="96"/><line x1="74" y1="103" x2="90" y2="103"/></g>
    <text x="104" y="101" font-size="15" fill="#5F6368">Search biblical places</text>
    <g filter="url(#shadow)"><rect x="366" y="500" width="40" height="40" rx="8" fill="#ffffff"/></g>
    <circle cx="386" cy="520" r="8" fill="none" stroke="#5F6368" stroke-width="2"/><circle cx="386" cy="520" r="2.5" fill="#5F6368"/>
    <g filter="url(#shadow)"><rect x="40" y="556" width="390" height="340" rx="16" fill="#ffffff"/></g>
    <rect x="215" y="566" width="40" height="4" rx="2" fill="#DADCE0"/>
    <rect x="56" y="586" width="96" height="72" rx="8" fill="#DADCE0"/>
    <text x="104" y="626" font-size="11" fill="#5F6368" text-anchor="middle">photo</text>
    <text x="164" y="606" font-size="20" font-weight="600" fill="#202124">Capernaum</text>
    <text class="muted" x="164" y="628">Kfar Nahum / Tell Hum</text>
    <rect x="164" y="638" width="112" height="22" rx="11" fill="#E6F4EA"/><text x="220" y="653" font-size="11" font-weight="500" fill="#137333" text-anchor="middle">High confidence</text>
    <text x="56" y="690" font-size="11" fill="#5F6368">Photo: Berthold Werner · Public domain · Wikimedia Commons</text>
    <g fill="#ffffff" stroke="#DADCE0" stroke-width="1.5"><circle cx="92" cy="736" r="22"/><circle cx="172" cy="736" r="22"/><circle cx="252" cy="736" r="22"/></g>
    <circle cx="92" cy="736" r="7" fill="none" stroke="#1A73E8" stroke-width="2"/><circle cx="92" cy="736" r="2" fill="#1A73E8"/>
    <g stroke="#1A73E8" stroke-width="2"><line x1="163" y1="736" x2="181" y2="736"/><line x1="243" y1="730" x2="261" y2="730"/><line x1="243" y1="736" x2="261" y2="736"/><line x1="243" y1="742" x2="255" y2="742"/></g>
    <text x="92" y="778" font-size="12" fill="#1A73E8" text-anchor="middle">Zoom to</text>
    <text x="172" y="778" font-size="12" fill="#1A73E8" text-anchor="middle">Copy link</text>
    <text x="252" y="778" font-size="12" fill="#1A73E8" text-anchor="middle">Sources</text>
    <text x="235" y="826" font-size="12" fill="#5F6368" text-anchor="middle">Drag up or tap for full details</text>
  </g>
  <rect x="40" y="28" width="390" height="844" rx="36" fill="none" stroke="#BDC1C6" stroke-width="2"/>

  <!-- Phone B: sheet expanded -->
  <g clip-path="url(#phoneB)">
    <rect x="470" y="28" width="390" height="844" fill="#ffffff"/>
    <rect x="470" y="28" width="390" height="220" fill="#DADCE0"/>
    <text x="665" y="140" font-size="12" fill="#5F6368" text-anchor="middle">Photo 1 / 2</text>
    <circle cx="828" cy="68" r="16" fill="#ffffff"/><text x="828" y="74" font-size="18" fill="#5F6368" text-anchor="middle">×</text>
    <text x="486" y="270" font-size="11" fill="#5F6368">Photo: Berthold Werner · Public domain · Wikimedia Commons</text>
    <text x="486" y="306" font-size="22" font-weight="600" fill="#202124">Capernaum</text>
    <text class="muted" x="486" y="330">Kfar Nahum / Tell Hum · City · Galilee</text>
    <line x1="470" y1="352" x2="860" y2="352" stroke="#DADCE0"/>
    <text class="h2" x="486" y="380">About</text>
    <rect x="486" y="394" width="340" height="10" rx="5" fill="#E8EAED"/><rect x="486" y="412" width="320" height="10" rx="5" fill="#E8EAED"/><rect x="486" y="430" width="200" height="10" rx="5" fill="#E8EAED"/>
    <line x1="470" y1="458" x2="860" y2="458" stroke="#DADCE0"/>
    <text class="h2" x="486" y="486">In the Bible · 18 passages</text>
    <text x="486" y="512" font-size="14" font-weight="600" fill="#202124">Matthew 4:13</text>
    <rect x="486" y="524" width="340" height="10" rx="5" fill="#E8EAED"/><rect x="486" y="542" width="280" height="10" rx="5" fill="#E8EAED"/>
    <text x="486" y="584" font-size="14" font-weight="500" fill="#1A73E8">Show all 18 passages</text>
    <line x1="470" y1="604" x2="860" y2="604" stroke="#DADCE0"/>
    <text class="h2" x="486" y="632">Old Testament connections · 1</text>
    <line x1="470" y1="664" x2="860" y2="664" stroke="#DADCE0"/>
    <text class="h2" x="486" y="692">Sources</text>
    <text class="muted" x="486" y="716">1. Pleiades place 678231</text>
    <text class="muted" x="486" y="738">2. Wikidata Q59174 …</text>
  </g>
  <rect x="470" y="28" width="390" height="844" rx="36" fill="none" stroke="#BDC1C6" stroke-width="2"/>

  <text class="note" x="40" y="896">Bottom sheet opens at about 40% height; zoom buttons hidden (pinch to zoom), reset view kept.</text>
  <text class="note" x="40" y="914">Same section order as on desktop. Full responsive polish is M7.</text>
  <text x="860" y="914" font-size="12" fill="#80868B" text-anchor="end">05 · Small screen · low fidelity</text>
</svg>
