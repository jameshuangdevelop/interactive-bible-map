<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Wireframe 02 — Place panel: Capernaum (desktop, low fidelity)</title>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3C4043" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3C4043" flood-opacity="0.15"/>
    </filter>
    <style>
      .label { font-size: 12px; fill: #202124; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; }
      .pin { fill: #C5221F; stroke: #ffffff; stroke-width: 2.5; }
      .cand { fill: #C5221F; stroke: #ffffff; stroke-width: 2; stroke-dasharray: 3 2; }
      .letter { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .note { font-size: 12px; fill: #C2185B; font-style: italic; }
      .leader { stroke: #C2185B; stroke-width: 1; fill: none; }
      .reserved { fill: none; stroke: #9AA0A6; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .reservedText { font-size: 13px; fill: #80868B; }
      .h2 { font-size: 16px; font-weight: 500; fill: #202124; }
      .body { font-size: 14px; fill: #202124; }
      .muted { font-size: 13px; fill: #5F6368; }
      .small { font-size: 12px; fill: #5F6368; }
      .link { fill: #1A73E8; }
      .ref { font-size: 14px; font-weight: 600; fill: #202124; }
      .verse { font-size: 15px; fill: #202124; font-family: Georgia, 'Noto Serif', 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- Map (Galilee, about zoom 11, schematic) -->
  <rect width="1440" height="900" fill="#F4F4F2"/>
  <ellipse cx="977" cy="450" rx="70" ry="160" fill="#D5E3EC" transform="rotate(8 977 450)"/>
  <text x="977" y="455" font-size="12" font-style="italic" fill="#4A7FA7" text-anchor="middle">Sea of Galilee</text>
  <circle cx="977" cy="480" r="8" fill="#188038" stroke="#ffffff" stroke-width="2.5"/>

  <g>
    <circle cx="925" cy="238" r="8" class="pin"/><text class="label" x="870" y="228">Chorazin</text>
    <circle cx="873" cy="405" r="8" class="pin"/><text class="label" x="811" y="409">Magdala</text>
    <circle cx="563" cy="630" r="8" class="pin"/><text class="label" x="577" y="634">Nazareth</text>
    <circle cx="634" cy="756" r="8" class="pin"/><text class="label" x="648" y="760">Nain</text>
  </g>
  <!-- Disputed candidates (lettered, dashed outline) -->
  <g>
    <circle cx="1035" cy="250" r="9" class="cand"/><text class="letter" x="1035" y="254">A</text>
    <circle cx="1022" cy="286" r="9" class="cand"/><text class="letter" x="1022" y="290">B</text>
    <text class="label" x="1050" y="254">Bethsaida</text>
    <circle cx="534" cy="500" r="9" class="cand"/><text class="letter" x="534" y="504">A</text>
    <circle cx="620" cy="548" r="9" class="cand"/><text class="letter" x="620" y="552">B</text>
    <text class="label" x="548" y="504">Cana</text>
  </g>
  <!-- Selected place: larger pin with shadow -->
  <g filter="url(#shadow)"><circle cx="940" cy="296" r="11" class="pin"/></g>
  <text class="label" x="848" y="300" font-weight="600">Capernaum</text>

  <!-- Reserved areas -->
  <rect class="reserved" x="824" y="16" width="200" height="48" rx="24"/>
  <text class="reservedText" x="924" y="45" text-anchor="middle">Map | Routes — M5</text>
  <rect class="reserved" x="1254" y="16" width="170" height="48" rx="24"/>
  <text class="reservedText" x="1339" y="45" text-anchor="middle">Modern | Ancient — M4</text>
  <rect class="reserved" x="674" y="820" width="500" height="56" rx="12"/>
  <text class="reservedText" x="924" y="853" text-anchor="middle">Timeline slider — M4</text>

  <!-- Map controls -->
  <g filter="url(#shadow)">
    <rect x="1384" y="700" width="40" height="80" rx="8" fill="#ffffff"/>
    <rect x="1384" y="792" width="40" height="40" rx="8" fill="#ffffff"/>
    <circle cx="1404" cy="866" r="11" fill="#ffffff"/>
  </g>
  <line x1="1390" y1="740" x2="1418" y2="740" stroke="#DADCE0"/>
  <text x="1404" y="728" font-size="20" fill="#5F6368" text-anchor="middle">+</text>
  <text x="1404" y="768" font-size="20" fill="#5F6368" text-anchor="middle">−</text>
  <circle cx="1404" cy="812" r="8" fill="none" stroke="#5F6368" stroke-width="2"/><circle cx="1404" cy="812" r="2.5" fill="#5F6368"/>
  <text x="1404" y="871" font-size="13" font-weight="700" fill="#5F6368" text-anchor="middle">i</text>

  <!-- Place panel -->
  <g filter="url(#shadow)"><rect x="0" y="0" width="408" height="900" fill="#ffffff"/></g>
  <rect x="0" y="0" width="408" height="240" fill="#DADCE0"/>
  <path d="M150,190 L200,130 L240,170 L262,150 L300,190 Z" fill="#BDC1C6"/>
  <circle cx="270" cy="115" r="14" fill="#BDC1C6"/>
  <text x="204" y="222" font-size="12" fill="#5F6368" text-anchor="middle">Photo 1 (lead image, capernaum-01)</text>
  <circle cx="26" cy="140" r="14" fill="#ffffff" opacity="0.9"/><text x="26" y="145" font-size="14" fill="#5F6368" text-anchor="middle">‹</text>
  <circle cx="382" cy="140" r="14" fill="#ffffff" opacity="0.9"/><text x="382" y="145" font-size="14" fill="#5F6368" text-anchor="middle">›</text>
  <rect x="348" y="206" width="44" height="22" rx="11" fill="#202124" opacity="0.7"/><text x="370" y="221" font-size="12" fill="#ffffff" text-anchor="middle">1 / 2</text>

  <!-- Search box floating over the panel -->
  <g filter="url(#shadow)"><rect x="16" y="16" width="376" height="48" rx="24" fill="#ffffff"/></g>
  <g stroke="#5F6368" stroke-width="2" stroke-linecap="round">
    <line x1="34" y1="33" x2="50" y2="33"/><line x1="34" y1="40" x2="50" y2="40"/><line x1="34" y1="47" x2="50" y2="47"/>
  </g>
  <text x="66" y="45" font-size="15" fill="#202124">Capernaum</text>
  <text x="368" y="46" font-size="18" fill="#5F6368" text-anchor="middle">×</text>

  <text class="small" x="24" y="262">Photo: Berthold Werner · <tspan class="link">Public domain</tspan> · <tspan class="link">Wikimedia Commons</tspan></text>
  <text class="small" x="24" y="280">Ruins at Tell Hum (caption from the media record)</text>

  <text x="24" y="318" font-size="22" font-weight="600" fill="#202124">Capernaum</text>
  <text class="muted" x="24" y="342" font-size="14">Kfar Nahum / Tell Hum</text>
  <text class="muted" x="24" y="362">Also known as Kfar Nahum, Talhum</text>
  <text class="muted" x="24" y="382">City · <tspan class="link">Galilee</tspan></text>
  <rect x="24" y="394" width="122" height="26" rx="13" fill="#E6F4EA"/>
  <text x="85" y="411" font-size="12" font-weight="500" fill="#137333" text-anchor="middle">High confidence</text>

  <!-- Actions -->
  <g fill="#ffffff" stroke="#DADCE0" stroke-width="1.5">
    <circle cx="60" cy="458" r="20"/><circle cx="140" cy="458" r="20"/><circle cx="220" cy="458" r="20"/>
  </g>
  <circle cx="60" cy="458" r="7" fill="none" stroke="#1A73E8" stroke-width="2"/><circle cx="60" cy="458" r="2" fill="#1A73E8"/>
  <text x="140" y="463" font-size="15" fill="#1A73E8" text-anchor="middle">🔗</text>
  <g stroke="#1A73E8" stroke-width="2"><line x1="211" y1="452" x2="229" y2="452"/><line x1="211" y1="458" x2="229" y2="458"/><line x1="211" y1="464" x2="223" y2="464"/></g>
  <text x="60" y="496" font-size="12" fill="#1A73E8" text-anchor="middle">Zoom to</text>
  <text x="140" y="496" font-size="12" fill="#1A73E8" text-anchor="middle">Copy link</text>
  <text x="220" y="496" font-size="12" fill="#1A73E8" text-anchor="middle">Sources</text>
  <line x1="0" y1="512" x2="408" y2="512" stroke="#DADCE0"/>

  <!-- About -->
  <text class="h2" x="24" y="540">About</text>
  <text class="body" x="24" y="564">Capernaum was a fishing village on the northwest</text>
  <text class="body" x="24" y="584">shore of the Sea of Galilee that served as a base for</text>
  <text class="body" x="24" y="604">Jesus' Galilean ministry … <tspan class="link" font-size="11" dy="-4">[1] [2]</tspan></text>
  <line x1="0" y1="622" x2="408" y2="622" stroke="#DADCE0"/>

  <!-- In the Bible -->
  <text class="h2" x="24" y="650">In the Bible · 18 passages</text>
  <text class="small" x="24" y="672" letter-spacing="1">MATTHEW</text>
  <text class="ref" x="24" y="694">Matthew 4:13</text>
  <text class="verse" x="24" y="716">Leaving Nazareth, he came and lived in</text>
  <text class="verse" x="24" y="738">Capernaum, which is by the sea, …</text>
  <text class="ref" x="24" y="764">Matthew 8:5</text>
  <text class="verse" x="24" y="786">When he came into Capernaum, a centurion …</text>
  <text x="24" y="814" font-size="14" font-weight="500" class="link">Show all 18 passages</text>
  <line x1="0" y1="830" x2="408" y2="830" stroke="#DADCE0"/>

  <!-- OT connections -->
  <text class="h2" x="24" y="858">Old Testament connections · 1</text>
  <text class="muted" x="24" y="882"><tspan font-weight="600" fill="#202124">Isaiah 9:1</tspan> — quoted in Matthew 4:13–16 … <tspan class="link" font-size="11" dy="-4">[3]</tspan></text>

  <!-- Annotations -->
  <path class="leader" d="M364,258 L440,262"/><text class="note" x="446" y="266">Credit under every photo: author · license (links to legal text) · Commons page</text>
  <path class="leader" d="M150,407 L440,407"/><text class="note" x="446" y="411">Confidence in words (a chip), never colour alone</text>
  <path class="leader" d="M244,458 L440,458"/><text class="note" x="446" y="462">Actions: Zoom to · Copy link (?place=capernaum) · Sources</text>
  <path class="leader" d="M226,598 L420,598 L440,586"/><text class="note" x="446" y="590">Every statement carries source markers that link to the Sources list</text>
  <path class="leader" d="M360,738 L440,700"/><text class="note" x="446" y="704">Scripture: WEB text in serif, grouped by book; first 5, then "Show all"</text>
  <text class="note" x="446" y="806">Panel continues: Places in (child records) · Sources · "Checked by the Fact-Checker · last reviewed" · Report an issue</text>
  <path class="leader" d="M1046,262 L1110,200"/><text class="note" x="1114" y="196">Disputed candidates: lettered pins, dashed outline</text>
  <path class="leader" d="M952,300 L1060,360"/><text class="note" x="1064" y="364">Selected place: larger pin</text>
  <text x="1430" y="892" font-size="12" fill="#80868B" text-anchor="end">02 · Place panel · desktop · low fidelity</text>
</svg>
