name: Image link check

on:
  pull_request:
    paths:
      - data/media/**
      - media/**
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  check-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check image links and AI media files
        run: npm run check:images
