name: Image link check

on:
  pull_request:
    paths:
      - data/media/**
      - media/**
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (pull request)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check changed PR image links and AI media files
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CHANGED_SINCE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run check:images -- --changed-since "$CHANGED_SINCE_REF"

      - name: Check image links and AI media files
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run check:images
