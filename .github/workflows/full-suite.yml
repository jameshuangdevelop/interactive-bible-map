name: Full browser suite

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app data
        run: npm run build:data

      - name: Export web app
        run: npm run export:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exported web app
        run: npm run verify:web:playwright
