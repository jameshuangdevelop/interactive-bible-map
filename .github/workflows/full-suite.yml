name: Full browser suite

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      FULL_SUITE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache basemap fixture
        uses: actions/cache@v4
        with:
          path: .cache/basemap-fixture
          key: basemap-fixture-${{ hashFiles('tests/fixtures/basemap-fixture.lock.json') }}

      - name: Fetch basemap fixture
        run: npm run fetch:basemap-fixture

      - name: Build app data
        run: npm run build:data

      - name: Export web app
        run: npm run export:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exported web app
        run: npm run verify:web:playwright

      - name: Live-network weekly smoke
        env:
          IBM_LIVE_NETWORK: "1"
        run: npx playwright test --workers=1 --retries=0 --grep "normal loads stay on the main basemap in a 5s observation window|modern map toggle preserves state and attribution|Asia Minor towns render black dots under names at year 50"
