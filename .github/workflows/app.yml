name: App scaffold

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint app
        run: npm run lint

      - name: Type-check app
        run: npm run typecheck

      - name: Run tests
        run: npm run test:all

      - name: Build app data
        run: npm run build:data

      - name: Export web app
        run: npm run export:web

      - name: Upload web export artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-export
          path: app/dist
